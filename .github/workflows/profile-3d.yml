name: GitHub Profile 3D Contrib

on:
  push:
    branches:
      - main
      - feat/profile-v2-motion
    paths-ignore:
      - "profile-3d-contrib/**"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply continuous contribution wave
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("profile-3d-contrib/profile-night-rainbow.svg")
          text = path.read_text()

          # Add a subtle, continuous vertical ripple to each contribution cell.
          # Negative begin times mean the wave is already in motion whenever
          # the SVG becomes visible; neighboring cells are phase-shifted so
          # motion travels diagonally across the contribution field.
          cell = re.compile(
              r'(<g transform="translate\\(([-+]?\\d+(?:\\.\\d+)?) ([-+]?\\d+(?:\\.\\d+)?)\\)">)'
              r'(?=<(?:animateTransform|rect stroke="none"))'
          )

          duration = 3.6
          count = 0

          def add_wave(match):
              nonlocal_count[0] += 1
              x = float(match.group(2))
              y = float(match.group(3))
              phase = ((x + 0.70 * y) / 20.0 * 0.10) % duration
              begin = -phase
              wave = (
                  '<animateTransform attributeName="transform" '
                  'type="translate" additive="sum" '
                  'values="0 0;0 -7;0 0;0 4;0 0" '
                  f'dur="{duration:.1f}s" begin="{begin:.3f}s" '
                  'repeatCount="indefinite"></animateTransform>'
              )
              return match.group(1) + wave

          nonlocal_count = [0]
          text = cell.sub(add_wave, text)
          count = nonlocal_count[0]

          if count < 300:
              raise SystemExit(
                  f"Only {count} contribution cells matched; generator format may have changed"
              )

          path.write_text(text)
          print(f"Added continuous wave motion to {count} contribution cells")
          PY

      - name: Commit generated profile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No profile changes"
            exit 0
          fi
          git commit -m "chore(profile): refresh 3D contributions"
          git push
