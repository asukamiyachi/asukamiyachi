name: GitHub Profile 3D Contrib

on:
  push:
    branches:
      - main
      - feat/profile-v2-motion
    paths-ignore:
      - "profile-3d-contrib/**"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated profile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No profile changes"
            exit 0
          fi
          git commit -m "chore(profile): refresh 3D contributions"
          git push
