name: GitHub Profile 3D Contrib

on:
  push:
    branches:
      - main
      - feat/profile-v2-motion
    paths-ignore:
      - "profile-3d-contrib/**"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply impact shockwave to contribution field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import re

          path = Path("profile-3d-contrib/profile-night-rainbow.svg")
          text = path.read_text()

          # Turn the contribution field into a repeating radial shockwave.
          # Each cell receives the same impact envelope, but its start time is
          # delayed by distance from the center so the crest expands outward.
          cell = re.compile(
              r'(<g transform="translate\(([-+]?\d+(?:\.\d+)?) ([-+]?\d+(?:\.\d+)?)\)">)'
              r'(?=<(?:animateTransform|rect stroke="none"))'
          )

          cx = 600.0
          cy = 470.0
          duration = 2.6
          travel_time = 0.65
          max_distance = 760.0
          count = 0

          def add_shockwave(match):
              nonlocal_count[0] += 1

              x = float(match.group(2))
              y = float(match.group(3))
              dx = x - cx
              dy = y - cy
              distance = math.hypot(dx, dy)

              # One ring starts at the center and reaches the field edge
              # about 0.65s later. Negative begin values keep the loop already
              # in progress whenever the profile becomes visible.
              delay = min(distance / max_distance, 1.0) * travel_time
              begin = delay - duration

              # Give the ring a slight radial kick in addition to the large
              # vertical lift so it reads as an impact rather than a sine wave.
              radial_x = 0.0 if distance < 1.0 else (dx / distance) * 8.0

              wave = (
                  '<animateTransform attributeName="transform" '
                  'type="translate" additive="sum" '
                  f'values="0 0;{radial_x * 0.35:.2f} -8;{radial_x:.2f} -32;'
                  f'{radial_x * -0.45:.2f} 12;{radial_x * 0.20:.2f} -5;0 0" '
                  'keyTimes="0;0.06;0.13;0.22;0.34;1" '
                  'calcMode="spline" '
                  'keySplines="0.2 0.9 0.2 1;'
                  '0.15 0.85 0.15 1;'
                  '0.35 0 0.65 1;'
                  '0.2 0.8 0.2 1;'
                  '0.4 0 0.6 1" '
                  f'dur="{duration:.1f}s" begin="{begin:.3f}s" '
                  'repeatCount="indefinite"></animateTransform>'
                  '<animate attributeName="opacity" '
                  'values="0.92;1;1;0.82;0.96;0.92" '
                  'keyTimes="0;0.06;0.13;0.22;0.34;1" '
                  'calcMode="spline" '
                  'keySplines="0.2 0.9 0.2 1;'
                  '0.15 0.85 0.15 1;'
                  '0.35 0 0.65 1;'
                  '0.2 0.8 0.2 1;'
                  '0.4 0 0.6 1" '
                  f'dur="{duration:.1f}s" begin="{begin:.3f}s" '
                  'repeatCount="indefinite"></animate>'
              )
              return match.group(1) + wave

          nonlocal_count = [0]
          text = cell.sub(add_shockwave, text)
          count = nonlocal_count[0]

          if count < 300:
              raise SystemExit(
                  f"Only {count} contribution cells matched; generator format may have changed"
              )

          path.write_text(text)
          print(f"Added radial impact shockwave to {count} contribution cells")
          PY

      - name: Annotate private Dart language
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("profile-3d-contrib/profile-night-rainbow.svg")
          text = path.read_text()

          chart = '<g transform="translate(40, 520)">'
          chart_at = text.find(chart)
          if chart_at < 0:
              raise SystemExit("Language chart not found")

          pie = '<g transform="translate(130, 130)">'
          pie_at = text.find(pie, chart_at)
          if pie_at < 0:
              raise SystemExit("Language pie not found")

          label_close = text.rfind('</g>', chart_at, pie_at)
          if label_close < 0:
              raise SystemExit("Language legend group end not found")

          legend = (
              '<rect x="0" y="200.417" width="21.667" height="21.667" '
              'fill="#00B4AB" class="stroke-bg" stroke-width="1px"></rect>'
              '<text dominant-baseline="middle" x="26" y="211.25" '
              'class="fill-fg" font-size="21.667px">'
              'Dart'
              '<title>Dart private-repository language marker.</title>'
              '</text>'
          )
          text = text[:label_close] + legend + text[label_close:]

          pie_at = text.find(pie, chart_at)
          ring = (
              '<circle r="123" fill="none" stroke="#00B4AB" stroke-width="4" '
              'stroke-dasharray="12 8" stroke-opacity="0.75">'
              '<animate attributeName="stroke-opacity" values="0.35;1;0.35" '
              'dur="2.6s" repeatCount="indefinite"></animate>'
              '<title>Dart private</title>'
              '</circle>'
          )
          insert_at = pie_at + len(pie)
          text = text[:insert_at] + ring + text[insert_at:]

          path.write_text(text)
          print("Added private Dart language marker")
          PY

      - name: Commit generated profile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No profile changes"
            exit 0
          fi
          git commit -m "chore(profile): refresh 3D contributions"
          git push
