<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-labelledby="title desc">
  <title id="title">Current vector</title>
  <desc id="desc">Animated strip showing current focus areas.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="96" rx="20" fill="#070b17"/>
  <rect x="1" y="1" width="1198" height="94" rx="19" fill="none" stroke="#64748b" stroke-opacity=".18"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="42" y="38" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2">CURRENT VECTOR</text>
    <text x="42" y="66" fill="#f8fafc" font-size="17" font-weight="800">AI SYSTEMS</text>
    <text x="310" y="66" fill="#f8fafc" font-size="17" font-weight="800">ROBOTICS</text>
    <text x="565" y="66" fill="#f8fafc" font-size="17" font-weight="800">PRODUCT</text>
    <text x="805" y="66" fill="#f8fafc" font-size="17" font-weight="800">DEV TOOLS</text>
    <text x="1086" y="66" fill="#94a3b8" font-size="16" font-weight="700">→ WORLD</text>
  </g>
  <circle cx="275" cy="60" r="3" fill="#334155"/>
  <circle cx="530" cy="60" r="3" fill="#334155"/>
  <circle cx="770" cy="60" r="3" fill="#334155"/>
  <circle cx="1050" cy="60" r="3" fill="#334155"/>
  <rect x="0" y="92" width="160" height="4" rx="2" fill="url(#line)">
    <animate attributeName="x" values="-160;1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>