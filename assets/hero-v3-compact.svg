<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="136" viewBox="0 0 1200 136" role="img" aria-labelledby="title desc">
  <title id="title">Asuka Miyachi — AI, Robotics, Product and Software</title>
  <desc id="desc">Minimal monochrome profile hero.</desc>

  <!--
    EDIT ZONE
    - Name:     #profile-name
    - Fields:   #profile-fields
    - Eyebrow:  #profile-eyebrow
    Keep this file intentionally simple so the hero can be redesigned quickly.
  -->

  <rect width="1200" height="136" rx="20" fill="#08090b"/>
  <rect x="1" y="1" width="1198" height="134" rx="19" fill="none" stroke="#26282d"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text id="profile-eyebrow"
      x="48" y="27"
      fill="#777b84"
      font-size="11"
      font-weight="700"
      letter-spacing="2.8">ASUKA / 2026</text>

    <text id="profile-name"
      x="46" y="79"
      fill="#ffffff"
      font-size="52"
      font-weight="800"
      letter-spacing="-1.4">ASUKA MIYACHI</text>

    <text id="profile-fields"
      x="48" y="111"
      fill="#b7bac1"
      font-family="'SFMono-Regular','Cascadia Mono','Courier New',monospace"
      font-size="15"
      font-weight="600"
      letter-spacing=".9">AI / ROBOTICS / PRODUCT / SOFTWARE</text>
  </g>
</svg>