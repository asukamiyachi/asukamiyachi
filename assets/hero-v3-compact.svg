<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Asuka Miyachi — AI, Robotics, Product and Software</title>
  <desc id="desc">Compact animated profile hero.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".55" stop-color="#090d1f"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="190" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="190" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="188" rx="23" fill="none" stroke="#64748b" stroke-opacity=".22"/>

  <rect x="-220" y="0" width="150" height="190" fill="url(#accent)" opacity=".055" transform="skewX(-20)">
    <animate attributeName="x" values="-220;1320" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="48" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="3">ASUKA / 2026</text>
    <text x="56" y="105" fill="#f8fafc" font-size="52" font-weight="850" letter-spacing=".5">ASUKA MIYACHI</text>
    <text x="57" y="140" fill="#cbd5e1" font-size="19" font-weight="650">AI · ROBOTICS · PRODUCT · SOFTWARE</text>

    <g transform="translate(760 55)">
      <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700" letter-spacing="2">CURRENT VECTOR</text>
      <text x="0" y="31" fill="#f8fafc" font-size="15" font-weight="750">AI SYSTEMS  ·  ROBOTICS  ·  PRODUCT  ·  DEV TOOLS</text>
      <rect x="0" y="47" width="340" height="3" rx="1.5" fill="url(#accent)">
        <animate attributeName="width" values="90;340;210;340" dur="3.8s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="83" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.6">LIVE ACTIVITY ↓</text>
    </g>

    <text x="56" y="172" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.5">BUILD → SHIP → LEARN → SCALE</text>
  </g>
</svg>