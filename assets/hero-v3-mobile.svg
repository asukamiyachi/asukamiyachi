<svg xmlns="http://www.w3.org/2000/svg" width="480" height="168" viewBox="0 0 480 168" role="img" aria-labelledby="title desc">
  <title id="title">Asuka Miyachi — AI, Robotics, Product and Software</title>
  <desc id="desc">Quiet typography, a fine rule, and a vermilion AM monogram.</desc>

  <!-- Edit text in #profile-name / #profile-fields; palette in this style block.
       Compact layout for README viewports up to 600px. Keep wording and palette in sync with hero-v3-compact.svg.
       No external fonts or animation: the contribution field carries the motion. -->
  <style>
    #background { fill: #F5F3EE; }
    #profile-name { fill: #20201E; }
    #profile-fields { fill: #62615D; }
    #rules { stroke: #C9C7C0; }
    @media (prefers-color-scheme: dark) {
      #background { fill: #191A19; }
      #profile-name { fill: #F5F3EE; }
      #profile-fields { fill: #B6B5AE; }
      #rules { stroke: #41423E; }
    }
  </style>

  <rect id="background" width="480" height="168"/>
  <g id="rules" fill="none" stroke-width="1">
    <path d="M24 16.5H456"/>
  </g>

  <!-- Live SVG text, with system fonts only. -->
  <g id="profile-name" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="500" letter-spacing="-2.5">
    <text x="22" y="61">ASUKA</text>
    <text x="22" y="109">MIYACHI</text>
  </g>
  <text id="profile-fields" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="18" letter-spacing="0.3">
    <tspan x="24" y="136">AI / ROBOTICS /</tspan>
    <tspan x="24" y="157">PRODUCT / SOFTWARE</tspan>
  </text>

  <!-- One geometric AM mark, not a literal seal. -->
  <g id="identity-mark" transform="translate(414 38)">
    <rect id="accent" width="42" height="42" fill="#E34432"/>
    <path d="M8 30V12H18V30M8 22H18M24 30V12L29 20L34 12V30" fill="none" stroke="#F5F3EE" stroke-width="2" stroke-linejoin="miter"/>
  </g>
</svg>
